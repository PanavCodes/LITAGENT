seed: 42

llm:
  provider: "fake"                       # fake, google-genai, openai, anthropic
  answer_model: "gemini-2.5-flash"
  judge_model: "gemini-2.5-pro"
  temperature: 0.0
  cache_dir: "data/cache/llm"
  max_retries: 3
  timeout_s: 30

data:
  query: "retrieval-augmented generation OR information retrieval OR dense retrieval OR reranking"
  categories:
    - "cs.IR"
    - "cs.CL"
  year_min: 2020
  max_papers: 600
  raw_dir: "data/raw"
  processed_dir: "data/processed"

chunking:
  size: 2000
  overlap: 50

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 64

retrieval:
  use_bm25: true
  use_dense: true
  use_rrf: true
  use_rerank: true
  candidates_per_retriever: 20
  rrf_k: 60
  rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  rerank_top_in: 20
  rerank_top_out: 5

graph:
  backend: "networkx"                    # neo4j or networkx
  uri: "bolt://localhost:7687"
  user: "neo4j"
  password: "litagentpassword"
  query_timeout_s: 10
  default_limit: 50
  db_path: "data/index/graph.pkl"

agent:
  grader_threshold: 0.6
  max_iterations: 2
  max_llm_calls: 12
  timeout_s: 90
  forced_route: null                     # null, graph, vector, both, none

uncertainty:
  use_self_consistency: false
  samples: 3
  abstain_threshold: 0.7
  strict_abstain: false
  weights:
    S1: 0.35
    S2: 0.35
    S5: 0.30
